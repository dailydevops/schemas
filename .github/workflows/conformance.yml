name: Conformance

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  conformance:
    name: Conformance (${{ matrix.tfm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # net8.0 runs the netstandard2.0 build (forced via SetTargetFramework in the test project files), the other legs resolve their builds on their own.
        tfm: [ net8.0, net9.0, net10.0, net11.0 ]
    env:
      SCHEMAS_CONFORMANCE_CACHE: ${{ runner.temp }}/conformance-suites
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: ${{ vars.NE_DOTNET_TARGETFRAMEWORKS }}
      - name: Restore suites
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCHEMAS_CONFORMANCE_CACHE }}
          key: conformance-suites-${{ hashFiles('tests/conformance/suites/*.json') }}
      # The runners append one rate row per test set to the job summary (GITHUB_STEP_SUMMARY) through ConformanceRateReporter.
      - name: Test ${{ matrix.tfm }}
        run: >
          dotnet test --solution ./Schemas.slnx --framework ${{ matrix.tfm }} --configuration Release
          --treenode-filter "/*/*Conformance*/*/*" --ignore-exit-code 8
